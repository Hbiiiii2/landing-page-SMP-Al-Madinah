name: smp-almadinah

services:
  # -----------------------------------------------------------
  # Web Server (Nginx)
  # -----------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: landingpage_smp
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8010}:80"
    labels:
      - "dockflare.enable=true"
      - "dockflare.hostname=smpaickkmb.sch.id"
      - "dockflare.service=http://landingpage_smp:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      smp_network:
        aliases:
          - landingpage_smp

  # -----------------------------------------------------------
  # Cloudflare Tunnel (Dedicated Container)
  # Aktifkan dengan menambahkan CLOUDFLARE_TUNNEL_TOKEN di .env
  # lalu jalankan: docker compose --profile tunnel up -d
  # -----------------------------------------------------------
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: smpalmadinah_tunnel
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
  #   depends_on:
  #     - web
  #   networks:
  #     - smp_network
  #   profiles:
  #     - tunnel

  # -----------------------------------------------------------
  # Application (PHP 8.4-FPM + Laravel + Filament)
  # -----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smpalmadinah_app:latest
    container_name: smpalmadinah_app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smp_network

  # -----------------------------------------------------------
  # Database (MySQL 8.0)
  # -----------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: smpalmadinah_db
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-smp}
      MYSQL_USER: ${DB_USERNAME:-smp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret123}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - smp_network

  # -----------------------------------------------------------
  # Background Queue Worker
  # -----------------------------------------------------------
  queue:
    image: smpalmadinah_app:latest
    container_name: smpalmadinah_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - smp_network

  # -----------------------------------------------------------
  # Scheduled Tasks Runner
  # -----------------------------------------------------------
  scheduler:
    image: smpalmadinah_app:latest
    container_name: smpalmadinah_scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - smp_network

volumes:
  db_data:
    driver: local
  app_storage:
    driver: local

networks:
  smp_network:
    driver: bridge
